[package]
description = "Tremor CLI Tool"
name = "tremor-cli"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"

[build-dependencies]
lalrpop = "0.22"
matches = "0.1.10"

[dev-dependencies]
temp-dir = "0.1"
criterion = "0.5"
float-cmp = "0.10"
matches = "0.1"
pretty_assertions = "1.4"

[dependencies]
tokio.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["color", "derive"] }
clap_complete = "4"
difference = "2"
env_logger = "0.11"
futures.workspace = true
halfbrown.workspace = true
http-types = "2"
log.workspace = true
log4rs = "1"
serde.workspace = true
serde_yaml.workspace = true
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
simd-json.workspace = true # { version = "0.13", features = ["known-key"] }
snmalloc-rs = { version = "0.3" }
surf = { version = "=2.3.2", default-features = false, features = [
  "encoding",
  "h1-client-rustls",
  "middleware-logger",
] }
tremor-api.workspace = true
tremor-codec.workspace = true
tremor-interceptor.workspace = true
tremor-common.workspace = true
tremor-pipeline.workspace = true
tremor-runtime.workspace = true
tremor-script.workspace = true
tremor-value.workspace = true
tremor-system.workspace = true
tremor-archive.workspace = true
url = "2"
error-chain.workspace = true
globwalk = "0.9"
port_scanner = "0.1"
shell-words = "1"
# needs to be compatible with rust-bert dependency
tch = { version = "0.17", optional = true }
termcolor = "1.4"

[[bin]]
name = "tremor"
path = "src/main.rs"
test = false

[features]
#
# We use *empty* feature dependencies so that we can switch allocators
# via feature flags. We *require* no default features so that that mechanism
# in src/alloc.rs works effectively in practice.
#
# It is an error to configure defaults in tremor.cli at this time until rust
# allows switching allocators at compile time - this is currently not well
# supported via the global_allocator attribute nor via cfg attributes that
# levarage features
#

snmalloc = []
bert = ["tremor-runtime/bert", "tch"]
default = []
stdalloc = []

fenster = "0.1.1"
file-mode = { version = "0.1", default-features = false }
float-cmp = "0.10"
futures = { version = "0.3.30", default-features = false }
getopts = "0.2"
glob = "0.3"
globwalk = "0.9"
googapis = "0.6"
gouth = "0.2"
grok = "2"
halfbrown = { version = "0.2", default-features = false }

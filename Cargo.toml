tremor-connectors-azure = { version = "0.13.0-rc.33", path = "tremor-connectors-azure" }
tremor-connectors-gcp = { version = "0.13.0-rc.33", path = "tremor-connectors-gcp" }
tremor-connectors-object-storage = { version = "0.13.0-rc.33", path = "tremor-connectors-object-storage" }
tremor-connectors-otel = { version = "0.13.0-rc.33", path = "tremor-connectors-otel" }
tremor-connectors-test-helpers = { version = "0.13.0-rc.33", path = "tremor-connectors-test-helpers" }
tremor-influx = { version = "0.13.0-rc.33", path = "tremor-influx" }
tremor-interceptor = { version = "0.13.0-rc.33", path = "tremor-interceptor" }
tremor-kv = "0.6"
tremor-otelapis = { version = "=0.2.4", default-features = false }
tremor-pipeline = { version = "0.13.0-rc.33", path = "tremor-pipeline" }
tremor-runtime = { version = "0.13.0-rc.33", path = "" }
tremor-script = { version = "0.13.0-rc.33", path = "tremor-script" }
tremor-system = { version = "0.13.0-rc.33", path = "tremor-system" }
tremor-value = { version = "0.13.0-rc.33", path = "tremor-value" }
trust-dns-resolver = { version = "0.23", default-features = false }
unicode-xid = "0.2"
url = { version = "2.5.2", default-features = false }
uuid = { version = "1.9", default-features = false }

atty = "0.2"
aws-config = { version = "1", default-features = false }
aws-credential-types = { version = "1", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false }
aws-types = { version = "1", default-features = false }
azure_core = { version = "0.20.0", default-features = false }
base64 = { version = "0.22", default-features = false }
beef = { version = "0.5.2", default-features = false }
bimap = { version = "0.6", default-features = false }
brotli = { version = "6", default-features = false }
byteorder = "1.5"
bytes = { version = "1.6.1", default-features = false }
chrono = { version = "0.4", default-features = false }
chrono-tz = "0.9"
cidr-utils = "0.6"
clap = "4"
clap_complete = "4"
clickhouse-chrono-tz = { version = "0.8", default-features = false }
clickhouse-rs = { version = "1.1.0-alpha.1", default-features = false }
codespan = "0.11"
criterion = "0.5"
cron = { version = "0.12", default-features = false }

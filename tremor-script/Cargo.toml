[package]
name = "tremor-script"
description = "Tremor Script Interpreter"
documentation = "https://docs.rs/tremor-script"
build = "build.rs"
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"

# Additional `RUSTFLAGS` to set (default: none)
rustc-args = ["-C target-feature=+avx,+avx2,+sse4.2"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "tremor_script"

[dependencies]
atty = "0.2"
beef.workspace = true
byteorder = "1"
chrono = "0.4"
chrono-tz = "0.10"
cidr-utils = "0.6"
codespan = "0.12"
dissect = "0.7"
distance = "0.4"
downcast-rs = "2.0"
glob = "0.3"
grok = "2"
sha2 = "0.10"
halfbrown = "0.3"
hdrhistogram = "7"
hostname = "0.4"
jumphash = "0.1"
lalrpop-util = "0.22"
percent-encoding = "2"
rand.workspace = true
regex.workspace = true
simd-json.workspace = true
simd-json-derive.workspace = true
serde.workspace = true
sketches-ddsketch = "0.3"
strip-ansi-escapes = "0.2"
termcolor = "1.4"
thiserror.workspace = true
tremor-common.workspace = true
tremor-influx.workspace = true
tremor-value.workspace = true
tremor-codec.workspace = true
tremor-kv = "0.7"
unicode-xid = "0.2"
url.workspace = true
value-trait.workspace = true
xz2 = "0.1"

[build-dependencies]
lalrpop = "0.22"
chrono-tz = "0.10"

[dev-dependencies]
criterion = "0.5"
float-cmp = "0.10"
pretty_assertions = "1"
proptest = "1"
tempfile = "3"
test-case = "3"

[features]
# this is required for the erlang EQC tests of the language
erlang-float-testing = []
# This is required for the language server to prevent unbounded growth of the area
arena-delete = []

[[bench]]
name = "array_flatten"
harness = false

[[bench]]
name = "arithmetics"
harness = false
